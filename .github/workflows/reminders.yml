name: CasaSync background reminders

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casasync-background-reminders
  cancel-in-progress: false

jobs:
  reminders:
    if: >-
      github.repository == 'kauanramalho/CasaSync' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      vars.REMINDER_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Process due reminders
        env:
          REMINDER_SCHEDULER_TOKEN: ${{ secrets.REMINDER_SCHEDULER_TOKEN }}
        run: python3 backend/reminder_scheduler.py
