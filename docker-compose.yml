services:
  db:
    image: postgres:16-alpine
    container_name: casasync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casasync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casasync}
      POSTGRES_DB: ${POSTGRES_DB:-casasync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - casasync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casasync} -d ${POSTGRES_DB:-casasync}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: casasync-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://casasync:casasync@db:5432/casasync}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      EMAIL_DEV_MODE: ${EMAIL_DEV_MODE:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: casasync-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - api

volumes:
  casasync_postgres_data:
